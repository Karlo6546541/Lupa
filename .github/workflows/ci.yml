name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Website (build, links, paywall, API tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pillow
      - name: Build site
        run: python3 build.py --base-url https://lupa-lovat.vercel.app
      - name: Check links
        run: python3 scripts/check_links.py
      - name: Check paywall (no subscriber text in public files)
        run: python3 scripts/check_paywall.py
      - name: Unit tests (API, push planning, tracker)
        run: |
          node --test "tests/*.test.*"
          python3 -m unittest discover -s tests
      - name: Package for Vercel (dry run)
        run: python3 scripts/package_vercel.py

  app:
    name: App (install, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
